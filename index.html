      // Early suppression of harmless AbortError from aborted fetch streams / Firestore channel resets
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (
          (reason && (reason.name === 'AbortError' || reason.code === 'aborted')) ||
          msg.indexOf('signal is aborted') !== -1 ||
          msg.indexOf('aborted without reason') !== -1
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          (event && event.error && (event.error.name === 'AbortError' || event.error.code === 'aborted')) ||
          msg.indexOf('signal is aborted') !== -1 ||
          msg.indexOf('aborted without reason') !== -1
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
      });

      // Ensure window.fetch has both a getter and setter so that iframe inspector / extension scripts
      // can safely wrap window.fetch without throwing "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });

          if (typeof Window !== 'undefined' && Window.prototype && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                }
              });
            } catch (eProto) {}
          }
        } catch (e) {}
      })();
