<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="25%" cy="30%" r="75%">
      <stop offset="0%" stopColor="#0B2B21" stop-opacity="0.95"/>
      <stop offset="55%" stopColor="#04130E" stop-opacity="0.98"/>
      <stop offset="100%" stopColor="#020806" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cardGlowRight" cx="80%" cy="45%" r="45%">
      <stop offset="0%" stopColor="#10B981" stop-opacity="0.22"/>
      <stop offset="70%" stopColor="#020806" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stopColor="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="spAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="35%" stopColor="#34D399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D221B" stop-opacity="0.96"/>
      <stop offset="100%" stopColor="#06140F" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" stop-opacity="0.45"/>
      <stop offset="50%" stopColor="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stopColor="#047857" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="outerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" stop-opacity="0.3"/>
      <stop offset="50%" stopColor="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stopColor="#059669" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#cardGlowRight)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.035" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Ambient Outer Framing Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#outerBorder)" stroke-width="1.5"/>

