  <!-- Logo Glow Circle -->
  <circle cx="108" cy="98" r="46" fill="url(#logoGlow)"/>

  <!-- Official LogoMark Glyph -->
  <g transform="translate(68, 58) scale(0.8)">
    <!-- Standalone S & P Continuous Ribbon -->
    <path d="M30 32C30 25.3726 35.3726 20 42 20H56C62.6274 20 68 25.3726 68 32C68 38.6274 62.6274 44 56 44H42C35.3726 44 30 49.3726 30 56C30 62.6274 35.3726 68 42 68H56"
