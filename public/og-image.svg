    <path d="M62 20L78 20M78 20L78 36M78 20L60 38"
          stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Waveform Bars inside Acoustic Core -->
    <rect x="36" y="48" width="3.5" height="10" rx="1.75" fill="#10B981"/>
    <rect x="43" y="44" width="3.5" height="18" rx="1.75" fill="#FFFFFF"/>
    <rect x="50" y="40" width="3.5" height="26" rx="1.75" fill="#10B981"/>
    <rect x="57" y="46" width="3.5" height="14" rx="1.75" fill="#FFFFFF"/>

