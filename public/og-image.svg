      <rect x="270" y="7" width="7" height="26" rx="3.5" fill="#10B981"/>
      <rect x="285" y="16" width="7" height="10" rx="3.5" fill="#059669"/>
      <rect x="300" y="5" width="7" height="30" rx="3.5" fill="#10B981"/>
      <rect x="315" y="1" width="7" height="40" rx="3.5" fill="#34D399"/>
      <rect x="330" y="9" width="7" height="22" rx="3.5" fill="#10B981"/>
      <rect x="345" y="13" width="7" height="14" rx="3.5" fill="#059669"/>
