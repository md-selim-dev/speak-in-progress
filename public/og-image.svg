  <path d="M0 126H1200M0 252H1200M0 378H1200M0 504H1200" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M240 0V630M480 0V630M720 0V630M960 0V630" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <circle cx="48" cy="48" r="48" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M30 32C30 25.3726 35.3726 20 42 20H56C62.6274 20 68 25.3726 68 32C68 38.6274 62.6274 44 56 44H42C35.3726 44 30 49.3726 30 56C30 62.6274 35.3726 68 42 68H56" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 44H64C71.732 44 78 50.268 78 58C78 65.732 71.732 72 64 72H46" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="27" r="4.5" fill="#10B981"/>
  </g>

  <!-- Brand Title -->
  <text x="220" y="145" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.02em">
